<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TechNova delivers modern technology news, artificial intelligence coverage, smartphone reviews, software guides, gadget discoveries, and practical how-to content.">
  <meta name="theme-color" content="#5b5ce2">
  <title>TechNova — Technology, Decoded</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    try {
      const savedTheme = localStorage.getItem("technova-theme");
      const preferredTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = savedTheme || preferredTheme;
    } catch (error) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-soft: #f7f8fc;
      --surface-raised: #ffffff;
      --text: #475569;
      --heading: #0b1020;
      --muted: #6b7280;
      --border: #e7e9f1;
      --border-strong: #d8dce8;
      --primary: #5b5ce2;
      --primary-dark: #4f46e5;
      --purple: #8b5cf6;
      --cyan: #06b6d4;
      --success: #10b981;
      --danger: #ef4444;
      --header-bg: rgba(255, 255, 255, 0.9);
      --footer-bg: #080c18;
      --footer-text: #cbd5e1;
      --shadow-sm: 0 5px 18px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 18px 45px rgba(15, 23, 42, 0.1);
      --shadow-lg: 0 28px 70px rgba(15, 23, 42, 0.15);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;
      --container: 1240px;
      --header-height: 76px;
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-display: "Manrope", "Inter", sans-serif;
      color-scheme: light;
    }

    [data-theme="dark"] {
      --bg: #080b14;
      --surface: #101521;
      --surface-soft: #0d121e;
      --surface-raised: #141a29;
      --text: #b8c2d4;
      --heading: #f7f9ff;
      --muted: #929db1;
      --border: #252c3d;
      --border-strong: #343d52;
      --primary: #8b8cf8;
      --primary-dark: #7778ee;
      --purple: #a78bfa;
      --cyan: #22d3ee;
      --header-bg: rgba(8, 11, 20, 0.9);
      --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 18px 45px rgba(0, 0, 0, 0.28);
      --shadow-lg: 0 28px 70px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 110px;
    }

    body {
      margin: 0;
      min-width: 320px;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    body.menu-open {
      overflow: hidden;
    }

    h1,
    h2,
    h3,
    h4,
    p {
      margin-top: 0;
    }

    h1,
    h2,
    h3,
    h4 {
      color: var(--heading);
      font-family: var(--font-display);
      line-height: 1.15;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    button,
    input,
    textarea,
    select {
      color: inherit;
      font: inherit;
    }

    button,
    [role="button"] {
      cursor: pointer;
    }

    ::selection {
      background: rgba(91, 92, 226, 0.22);
      color: var(--heading);
    }

    :focus-visible {
      outline: 3px solid rgba(91, 92, 226, 0.38);
      outline-offset: 3px;
    }

    .container {
      width: min(calc(100% - 40px), var(--container));
      margin-inline: auto;
    }

    .site-main {
      min-height: 65vh;
    }

    .page-enter {
      animation: pageEnter 0.45s ease both;
    }

    @keyframes pageEnter {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .skip-link {
      position: fixed;
      z-index: 3000;
      top: 12px;
      left: 12px;
      padding: 10px 16px;
      border-radius: 10px;
      background: var(--heading);
      color: var(--bg);
      font-weight: 700;
      transform: translateY(-150%);
      transition: transform 0.2s ease;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      color: var(--primary);
      font-family: var(--font-display);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 20px;
      height: 2px;
      border-radius: 99px;
      background: currentColor;
      content: "";
    }

    .section {
      padding: 82px 0;
    }

    .section-soft {
      background: var(--surface-soft);
    }

    .section-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 32px;
    }

    .section-heading h2 {
      margin-bottom: 8px;
      font-size: clamp(1.75rem, 3vw, 2.55rem);
      letter-spacing: -0.035em;
    }

    .section-heading p {
      max-width: 650px;
      margin-bottom: 0;
      color: var(--muted);
    }

    .section-kicker {
      margin-bottom: 10px;
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .btn {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 11px 19px;
      border: 1px solid transparent;
      border-radius: 12px;
      font-family: var(--font-display);
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--purple));
      box-shadow: 0 10px 24px rgba(91, 92, 226, 0.24);
      color: #fff;
    }

    .btn-primary:hover {
      box-shadow: 0 14px 30px rgba(91, 92, 226, 0.34);
    }

    .btn-light {
      background: #fff;
      box-shadow: var(--shadow-sm);
      color: #111827;
    }

    .btn-outline {
      border-color: var(--border-strong);
      background: var(--surface);
      color: var(--heading);
    }

    .btn-outline:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--primary);
      font-family: var(--font-display);
      font-size: 0.86rem;
      font-weight: 800;
    }

    .text-link svg {
      transition: transform 0.2s ease;
    }

    .text-link:hover svg {
      transform: translateX(4px);
    }

    .site-header {
      position: sticky;
      z-index: 1000;
      top: 0;
      border-bottom: 1px solid var(--border);
      background: var(--header-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .header-inner {
      display: flex;
      height: var(--header-height);
      align-items: center;
      gap: 26px;
    }

    .brand {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 10px;
      color: var(--heading);
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .brand:hover .brand-mark {
      transform: rotate(-5deg) scale(1.04);
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(145deg, #6667ee, #8b5cf6);
      box-shadow: 0 8px 20px rgba(91, 92, 226, 0.27);
      color: #fff;
      transition: transform 0.25s ease;
    }

    .brand-mark svg {
      width: 23px;
      height: 23px;
    }

    .brand-name span {
      color: var(--primary);
    }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: auto;
    }

    .desktop-nav a {
      position: relative;
      padding: 11px 10px;
      border-radius: 9px;
      color: var(--text);
      font-size: 0.83rem;
      font-weight: 600;
      white-space: nowrap;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .desktop-nav a:hover,
    .desktop-nav a.active {
      background: rgba(91, 92, 226, 0.08);
      color: var(--primary);
    }

    .desktop-nav a.active::after {
      position: absolute;
      right: 10px;
      bottom: 5px;
      left: 10px;
      height: 2px;
      border-radius: 99px;
      background: var(--primary);
      content: "";
    }

    .header-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 7px;
    }

    .icon-button {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--heading);
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .icon-button:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-1px);
    }

    .menu-toggle {
      display: none;
    }

    .mobile-nav {
      position: absolute;
      top: 100%;
      right: 0;
      left: 0;
      display: none;
      max-height: calc(100vh - var(--header-height));
      overflow-y: auto;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow-lg);
    }

    .mobile-nav.open {
      display: block;
      animation: mobileMenu 0.22s ease both;
    }

    @keyframes mobileMenu {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .mobile-nav-inner {
      display: grid;
      gap: 5px;
      padding: 18px 20px 24px;
    }

    .mobile-nav a {
      display: flex;
      min-height: 46px;
      align-items: center;
      justify-content: space-between;
      padding: 10px 13px;
      border-radius: 11px;
      color: var(--heading);
      font-family: var(--font-display);
      font-weight: 700;
    }

    .mobile-nav a:hover,
    .mobile-nav a.active {
      background: rgba(91, 92, 226, 0.09);
      color: var(--primary);
    }

    .hero-section {
      position: relative;
      overflow: hidden;
      padding: 54px 0 76px;
      background:
        radial-gradient(circle at 92% 14%, rgba(139, 92, 246, 0.13), transparent 28%),
        radial-gradient(circle at 3% 88%, rgba(6, 182, 212, 0.09), transparent 25%),
        var(--bg);
    }

    .hero-glow {
      position: absolute;
      top: -150px;
      right: -100px;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(91, 92, 226, 0.12), rgba(139, 92, 246, 0.05));
      filter: blur(2px);
      pointer-events: none;
    }

    .hero-shell {
      position: relative;
      display: grid;
      min-height: 530px;
      grid-template-columns: 0.92fr 1.08fr;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      background: var(--surface);
      box-shadow: var(--shadow-lg);
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 54px 34px 54px 52px;
    }

    .hero-badge,
    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border-radius: 99px;
      background: rgba(91, 92, 226, 0.1);
      color: var(--primary);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.07em;
      line-height: 1;
      text-transform: uppercase;
    }

    .hero-title {
      max-width: 650px;
      margin: 20px 0 20px;
      font-size: clamp(2.25rem, 4.3vw, 4.2rem);
      font-weight: 800;
      letter-spacing: -0.055em;
    }

    .hero-description {
      max-width: 570px;
      margin-bottom: 24px;
      color: var(--text);
      font-size: 1.06rem;
    }

    .article-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 15px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
    }

    .article-meta span,
    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .meta-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--border-strong);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 18px;
      margin-top: 28px;
    }

    .hero-visual {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background: #111827;
    }

    .hero-visual::after {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 45%, rgba(5, 8, 18, 0.48));
      content: "";
      pointer-events: none;
    }

    .hero-visual img {
      width: 100%;
      height: 100%;
      min-height: 530px;
      object-fit: cover;
      transition: transform 0.8s ease;
    }

    .hero-shell:hover .hero-visual img {
      transform: scale(1.025);
    }

    .hero-label {
      position: absolute;
      z-index: 2;
      right: 24px;
      bottom: 24px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 13px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 12px;
      background: rgba(8, 12, 24, 0.54);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .hero-label-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 0 5px rgba(52, 211, 153, 0.14);
    }

    .article-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .article-card {
      display: flex;
      min-width: 0;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface-raised);
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .article-card:hover {
      border-color: rgba(91, 92, 226, 0.35);
      box-shadow: var(--shadow-md);
      transform: translateY(-6px);
    }

    .card-media {
      position: relative;
      display: block;
      overflow: hidden;
      aspect-ratio: 16 / 10;
      background: linear-gradient(135deg, #dbeafe, #ede9fe);
    }

    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.55s ease;
    }

    .article-card:hover .card-media img {
      transform: scale(1.055);
    }

    .card-media .category-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.13);
      color: var(--cat-color, var(--primary));
      backdrop-filter: blur(10px);
    }

    .card-body {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 22px;
    }

    .card-category {
      margin-bottom: 10px;
      color: var(--cat-color, var(--primary));
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .card-title {
      margin-bottom: 11px;
      font-size: 1.22rem;
      letter-spacing: -0.025em;
    }

    .card-title a {
      transition: color 0.2s ease;
    }

    .card-title a:hover {
      color: var(--primary);
    }

    .card-description {
      display: -webkit-box;
      overflow: hidden;
      margin-bottom: 19px;
      color: var(--muted);
      font-size: 0.9rem;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.71rem;
      font-weight: 600;
    }

    .card-read {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--primary);
      font-size: 0.78rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .card-read svg {
      transition: transform 0.2s ease;
    }

    .card-read:hover svg {
      transform: translateX(3px);
    }

    .latest-section {
      padding-top: 74px;
    }

    .trending-wrap {
      padding: 76px 0;
      background: var(--surface-soft);
    }

    .trending-panel {
      position: relative;
      overflow: hidden;
      padding: 38px;
      border-radius: var(--radius-xl);
      background:
        radial-gradient(circle at 95% 15%, rgba(139, 92, 246, 0.28), transparent 26%),
        radial-gradient(circle at 7% 96%, rgba(6, 182, 212, 0.18), transparent 27%),
        #0b1020;
      box-shadow: var(--shadow-lg);
      color: #dbe4f4;
    }

    .trending-panel::before {
      position: absolute;
      top: -80px;
      right: -60px;
      width: 250px;
      height: 250px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      content: "";
    }

    .trending-heading {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 30px;
    }

    .trending-heading h2 {
      margin-bottom: 7px;
      color: #fff;
      font-size: clamp(1.8rem, 3vw, 2.55rem);
      letter-spacing: -0.04em;
    }

    .trending-heading p {
      margin-bottom: 0;
      color: #94a3b8;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .live-pill::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 0 5px rgba(52, 211, 153, 0.11);
      content: "";
    }

    .trending-grid {
      position: relative;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 25px;
    }

    .topic-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .topic-card {
      display: flex;
      min-height: 98px;
      align-items: center;
      gap: 14px;
      padding: 17px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 17px;
      background: rgba(255, 255, 255, 0.055);
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .topic-card:hover {
      border-color: rgba(139, 92, 246, 0.42);
      background: rgba(255, 255, 255, 0.085);
      transform: translateY(-3px);
    }

    .topic-icon {
      display: grid;
      width: 43px;
      height: 43px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 13px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.85), rgba(139, 92, 246, 0.75));
      color: #fff;
    }

    .topic-card strong {
      display: block;
      margin-bottom: 3px;
      color: #fff;
      font-family: var(--font-display);
      font-size: 0.91rem;
    }

    .topic-card small {
      color: #8290a7;
      font-size: 0.72rem;
    }

    .trend-list {
      display: grid;
      gap: 4px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .trend-list li {
      display: grid;
      grid-template-columns: 38px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 14px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .trend-list li:last-child {

      return String(value).replace(/[&<>"']/g, character => ({

        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[character]);
    }

      return `<div class="pagination" aria-label="Category pagination">${markup}</div>`;

                <div class="category-feature-copy">
                  <span class="category-badge" style="--cat-color:${category.color};background:${category.tint};color:${category.color}">Featured</span>
                  <h2><a href="#/article/${featured.slug}">${escapeHTML(featured.title)}</a></h2>
                  <p>${escapeHTML(featured.description)}</p>
                  <div class="article-meta">
                    <span>${escapeHTML(featured.author)}</span><span class="meta-dot"></span>
                    <span>${formatDate(featured.published)}</span><span class="meta-dot"></span>
                    <span>${featured.readTime} min read</span>
                  </div>
                  <a class="btn btn-primary" href="#/article/${featured.slug}">Read Article ${icon("arrowRight", 17)}</a>
                </div>
              </article>

              <div class="section-heading">
                <div>
                  <div class="section-kicker">More to explore</div>
                  <h2>Latest ${escapeHTML(category.name)} Articles</h2>
                  <p>Browse our complete collection of ${escapeHTML(category.shortName.toLowerCase())} coverage.</p>
                </div>
                <span class="text-link">${articles.length} sample articles ${icon("book", 15)}</span>
              </div>

              <div class="article-grid">
                ${visibleArticles.map(articleCard).join("")}
              </div>
              ${paginationMarkup(currentPage, totalPages, slug)}
            </div>
          </section>
        </div>
      `;
    }

    function searchPage(query = "") {
      const normalized = query.trim().toLowerCase();
      const results = normalized ? SAMPLE_ARTICLES.filter(article => {
        const category = CATEGORIES[article.category].name;
        return [article.title, article.description, category, ...article.tags].join(" ").toLowerCase().includes(normalized);
      }) : [];

      const content = normalized ? `
        <div class="results-header">
          <div>
            <h2>${results.length} ${results.length === 1 ? "result" : "results"} for “${escapeHTML(query)}”</h2>
            <p>Search results are matched against the local sample article library.</p>
          </div>
          <a class="text-link" href="#/search">Clear search ${icon("close", 15)}</a>
        </div>
        ${results.length ? `<div class="article-grid">${results.map(articleCard).join("")}</div>` : `
          <div class="empty-state">
            <span class="empty-state-icon">${icon("search", 28)}</span>
            <h3>No matching articles found</h3>
            <p>Try a broader phrase such as “AI,” “smartphones,” “privacy,” “apps,” or “gadgets.”</p>
            <a class="btn btn-primary" href="#/search">Reset Search</a>
          </div>
        `}
      ` : `
        <div class="empty-state">
          <span class="empty-state-icon">${icon("search", 29)}</span>
          <h3>What are you looking for?</h3>
          <p>Search TechNova's sample stories by article title, description, category, or topic.</p>
          <div class="popular-searches">
            <a href="#/search?q=Artificial%20Intelligence">Artificial Intelligence</a>
            <a href="#/search?q=Smartphones">Smartphones</a>
            <a href="#/search?q=Apps">Apps</a>
            <a href="#/search?q=Gadgets">Gadgets</a>
            <a href="#/search?q=Cybersecurity">Cybersecurity</a>
          </div>
        </div>
      `;

      return `
        <div class="page-enter">
          <section class="search-hero">
            <div class="container">
              <div class="eyebrow">Search TechNova</div>
              <h1>Find your next great read.</h1>
              <p>Search our sample technology library for news, reviews, comparisons, and practical guides.</p>
              <form class="search-form" id="searchForm" role="search">
                <label class="sr-only" for="searchInput">Search articles</label>
                <input id="searchInput" name="q" type="search" value="${escapeHTML(query)}" placeholder="Search AI, smartphones, cybersecurity..." autocomplete="off">
                <button class="btn btn-primary" type="submit">Search ${icon("search", 17)}</button>
              </form>
            </div>
          </section>
          <section class="search-content">
            <div class="container">${content}</div>
          </section>
        </div>
      `;
    }

    function aboutPage() {
      return `
        <div class="page-enter">
          <section class="about-hero">
            <div class="container">
              <div class="eyebrow">About TechNova</div>
              <h1>Technology should inspire you, not overwhelm you.</h1>
              <p>TechNova is a modern technology publication and educational resource built to explain what matters, why it matters, and how it can fit into real life.</p>
            </div>
          </section>

          <section class="about-content">
            <div class="container">
              <div class="about-intro">
                <div>
                  <div class="eyebrow">Our story</div>
                  <h2>Clear thinking for a fast-moving world.</h2>
                </div>
                <div>
                  <p>Technology changes quickly, but useful journalism should not feel rushed. TechNova was designed as a calm, thoughtful place to understand emerging products, useful software, artificial intelligence, and the wider forces shaping digital life.</p>
                  <p>Our frontend combines editorial storytelling with practical discovery. The goal is simple: help readers spend less time sorting through noise and more time finding ideas, tools, and answers they can use.</p>
                </div>
              </div>

              <div class="stats-grid" aria-label="Publication highlights">
                <div class="stat-card"><strong>7</strong><span>Focused editorial categories</span></div>
                <div class="stat-card"><strong>28</strong><span>Sample technology stories</span></div>
                <div class="stat-card"><strong>100%</strong><span>Reader-focused explanations</span></div>
                <div class="stat-card"><strong>24/7</strong><span>Accessible on every screen</span></div>
              </div>

              <div class="section-heading">
                <div>
                  <div class="section-kicker">What guides us</div>
                  <h2>Our editorial principles</h2>
                  <p>Every future story and feature should reflect these simple ideas.</p>
                </div>
              </div>

              <div class="values-grid">
                <article class="value-card">
                  <span class="value-icon">${icon("eye", 22)}</span>
                  <h3>Clarity over complexity</h3>
                  <p>We translate difficult ideas into straightforward explanations without removing the context that makes them useful.</p>
                </article>
                <article class="value-card">
                  <span class="value-icon">${icon("zap", 22)}</span>
                  <h3>Practical value first</h3>
                  <p>Readers should leave every article with a clearer idea, a useful decision, or a next step they can take.</p>
                </article>
                <article class="value-card">
                  <span class="value-icon">${icon("shield", 22)}</span>
                  <h3>Responsible by design</h3>
                  <p>We are careful with claims, transparent about examples, and conscious of the privacy and security implications of modern technology.</p>
                </article>
              </div>

              <div class="about-cta">
                <div>
                  <h3>Stay curious. Stay informed.</h3>
                  <p>Explore the latest sample stories from the TechNova editorial desk.</p>
                </div>
                <a class="btn btn-primary" href="#/category/news">Browse Technology News ${icon("arrowRight", 18)}</a>
              </div>
            </div>
          </section>
        </div>
      `;
    }

    function contactPage() {
      return `
        <div class="page-enter">
          <section class="contact-hero">
            <div class="container">
              <div class="eyebrow">Contact TechNova</div>
              <h1>Let's talk technology.</h1>
              <p>Have a question, correction, story idea, or feedback? This frontend demo is ready to showcase the contact experience.</p>
            </div>
          </section>

          <section class="contact-content">
            <div class="container contact-grid">
              <aside class="contact-details">
                <div class="eyebrow">Get in touch</div>
                <h2>We'd love to hear from you.</h2>
                <p>Use the form to preview how readers can get in touch. No information is transmitted, saved, or connected to a backend in this phase.</p>

                <div class="contact-item">
                  <span class="contact-item-icon">${icon("mail", 19)}</span>
                  <span><strong>Email</strong><a href="mailto:hello@technova.example">hello@technova.example</a></span>
                </div>
                <div class="contact-item">
                  <span class="contact-item-icon">${icon("message", 19)}</span>
                  <span><strong>Editorial desk</strong><span>Questions, ideas, and feedback</span></span>
                </div>
                <div class="contact-item">
                  <span class="contact-item-icon">${icon("pin", 19)}</span>
                  <span><strong>Digital workspace</strong><span>Available for readers everywhere</span></span>
                </div>
              </aside>

              <div class="contact-form">
                <h2>Send us a message</h2>
                <p>All fields are required for the frontend demonstration.</p>
                <form id="contactForm">
                  <div class="form-grid">
                    <div class="form-field">
                      <label for="contactName">Name</label>
                      <input id="contactName" name="name" type="text" autocomplete="name" placeholder="Your name" required>
                    </div>
                    <div class="form-field">
                      <label for="contactEmail">Email</label>
                      <input id="contactEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-field full">
                      <label for="contactSubject">Subject</label>
                      <input id="contactSubject" name="subject" type="text" placeholder="What is your message about?" required>
                    </div>
                    <div class="form-field full">
                      <label for="contactMessage">Message</label>
                      <textarea id="contactMessage" name="message" placeholder="Tell us a little more..." required></textarea>
                    </div>
                  </div>
                  <button class="btn btn-primary" type="submit">Submit Demo Message ${icon("arrowRight", 17)}</button>
                  <div class="demo-note">
                    ${icon("shield", 17)}
                    <span><strong>Frontend demonstration:</strong> submitting this form does not send or store your information. Backend integration will be added in a future phase.</span>
                  </div>
                  <div id="contactMessageBox" aria-live="polite"></div>
                </form>
              </div>
            </div>
          </section>
        </div>
      `;
    }

    function legalPage(type) {
      const content = LEGAL_CONTENT[type];
      if (!content) return notFoundPage("Page not found");
      return `
        <div class="page-enter">
          <section class="legal-page">
            <div class="container legal-content">
              <div class="breadcrumbs"><a href="#/">Home</a>${icon("chevronRight", 13)}<span>${escapeHTML(content.title)}</span></div>
              <h1>${escapeHTML(content.title)}</h1>
              <div class="legal-updated">${escapeHTML(content.updated)}</div>
              <p>${escapeHTML(content.intro)}</p>
              ${content.sections.map(section => `
                <h2>${escapeHTML(section[0])}</h2>
                <p>${escapeHTML(section[1])}</p>
              `).join("")}
              <a class="btn btn-outline" href="#/">Return Home ${icon("arrowRight", 17)}</a>
            </div>
          </section>
        </div>
      `;
    }

    function notFoundPage(title = "Page not found") {
      return `
        <div class="page-enter not-found">
          <div>
            <div class="not-found-code">404</div>
            <h1>${escapeHTML(title)}</h1>
            <p>The page you requested could not be found. It may have moved, or the link may be incorrect.</p>
            <a class="btn btn-primary" href="#/">Back to Homepage ${icon("arrowRight", 18)}</a>
          </div>
        </div>
      `;
    }

    function parseRoute() {
      const raw = window.location.hash.replace(/^#/, "") || "/";
      const separatorIndex = raw.indexOf("?");
      const path = separatorIndex >= 0 ? raw.slice(0, separatorIndex) : raw;
      const query = separatorIndex >= 0 ? raw.slice(separatorIndex + 1) : "";
      return { path, params: new URLSearchParams(query) };
    }

    function updateNavigation(path) {
      document.querySelectorAll("[data-nav-route]").forEach(link => {
        const route = link.getAttribute("data-nav-route");
        const active = route === "/" ? path === "/" : path === route;
        link.classList.toggle("active", active);
        if (active) {
          link.setAttribute("aria-current", "page");
        } else {
          link.removeAttribute("aria-current");
        }
      });
    }

    function render(preserveScroll = false) {
      const { path, params } = parseRoute();
      let markup = "";
      let pageTitle = "TechNova — Technology, Decoded";

      if (path === "/" || path === "") {
        markup = homePage();
      } else if (path.startsWith("/category/")) {
        const slug = decodeURIComponent(path.split("/")[2] || "");
        markup = renderCategory(slug);
        pageTitle = `${CATEGORIES[slug]?.name || "Category"} — TechNova`;
      } else if (path.startsWith("/article/")) {
        const slug = decodeURIComponent(path.split("/")[2] || "");
        const article = SAMPLE_ARTICLES.find(item => item.slug === slug);
        if (article) {
          markup = renderArticle(article);
          pageTitle = `${article.title} — TechNova`;
        } else {
          markup = notFoundPage("Article not found");
        }
      } else if (path === "/search") {
        markup = searchPage(params.get("q") || "");
        pageTitle = "Search — TechNova";
      } else if (path === "/about") {
        markup = aboutPage();
        pageTitle = "About Us — TechNova";
      } else if (path === "/contact") {
        markup = contactPage();
        pageTitle = "Contact Us — TechNova";
      } else if (path === "/privacy" || path === "/terms" || path === "/disclaimer") {
        const type = path.slice(1);
        markup = legalPage(type);
        pageTitle = `${LEGAL_CONTENT[type].title} — TechNova`;
      } else {
        markup = notFoundPage();
      }

      main.innerHTML = markup;
      document.title = pageTitle;
      updateNavigation(path);
      closeMobileMenu();

      if (!preserveScroll) {
        window.scrollTo({ top: 0, behavior: "auto" });
      }

      requestAnimationFrame(updateReadingProgress);
    }

    function updateReadingProgress() {
      const progress = document.getElementById("readingProgress");
      if (!progress) return;
      const article = document.querySelector(".article-cover");
      if (!article) {
        progress.style.transform = "scaleX(0)";
        return;
      }
      const articleTop = window.scrollY + article.getBoundingClientRect().top;
      const total = article.offsetHeight + 300;
      const current = Math.max(0, window.scrollY - articleTop + 120);
      const ratio = Math.min(1, current / total);
      progress.style.transform = `scaleX(${ratio})`;
    }

    function setTheme(theme, persist = true) {
      document.documentElement.dataset.theme = theme;
      if (persist) {
        try {
          localStorage.setItem("technova-theme", theme);
        } catch (error) {
          // The selected theme still works for the current session.
        }
      }
      const isDark = theme === "dark";
      themeToggle.innerHTML = icon(isDark ? "sun" : "moon", 19);
      themeToggle.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
      themeToggle.setAttribute("aria-pressed", String(isDark));
    }

    function closeMobileMenu() {
      mobileNav.classList.remove("open");
      menuToggle.setAttribute("aria-expanded", "false");
      menuToggle.setAttribute("aria-label", "Open navigation menu");
      menuToggle.innerHTML = icon("menu", 21);
      document.body.classList.remove("menu-open");
    }

    function toggleMobileMenu() {
      const isOpen = mobileNav.classList.toggle("open");
      menuToggle.setAttribute("aria-expanded", String(isOpen));
      menuToggle.setAttribute("aria-label", isOpen ? "Close navigation menu" : "Open navigation menu");
      menuToggle.innerHTML = icon(isOpen ? "close" : "menu", 21);
      document.body.classList.toggle("menu-open", isOpen);
    }

    function showToast(message) {
      clearTimeout(state.toastTimer);
      toast.innerHTML = `${icon("check", 18)}<span>${escapeHTML(message)}</span>`;
      toast.classList.add("show");
      state.toastTimer = setTimeout(() => toast.classList.remove("show"), 3600);
    }

    async function copyCurrentLink() {
      const link = window.location.href;
      try {
        await navigator.clipboard.writeText(link);
      } catch (error) {
        const temporaryInput = document.createElement("textarea");
        temporaryInput.value = link;
        temporaryInput.style.position = "fixed";
        temporaryInput.style.opacity = "0";
        document.body.appendChild(temporaryInput);
        temporaryInput.select();
        document.execCommand("copy");
        temporaryInput.remove();
      }
      showToast("Article link copied to your clipboard.");
    }

    themeToggle.addEventListener("click", () => {
      const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      setTheme(nextTheme);
    });

    menuToggle.addEventListener("click", toggleMobileMenu);

    document.addEventListener("click", event => {
      const scrollLink = event.target.closest("[data-scroll-target]");
      if (scrollLink) {
        event.preventDefault();
        const target = document.getElementById(scrollLink.getAttribute("data-scroll-target"));
        if (target) {
          target.scrollIntoView({ behavior: "smooth", block: "start" });
        }
        return;
      }

      const copyButton = event.target.closest("[data-copy-link]");
      if (copyButton) {
        copyCurrentLink();
        return;
      }

      const categoryPageButton = event.target.closest("[data-category-page]");
      if (categoryPageButton && !categoryPageButton.disabled) {
        const page = Number(categoryPageButton.getAttribute("data-category-page"));
        const slug = categoryPageButton.getAttribute("data-category-slug") || parseRoute().path.split("/")[2];
        state.categoryPages[slug] = page;
        render(true);
        requestAnimationFrame(() => {
          document.getElementById("categoryListing")?.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      }
    });

    document.addEventListener("submit", event => {
      if (event.target.id === "newsletterForm") {
        event.preventDefault();
        const email = document.getElementById("newsletterEmail").value.trim();
        const message = document.getElementById("newsletterMessage");
        message.innerHTML = `<div class="form-message success">${icon("check", 16)} Thanks${email ? `, ${escapeHTML(email)}` : ""}! This is a frontend demo—your email was not stored or transmitted.</div>`;
        event.target.reset();
        showToast("Newsletter demo completed. No email was stored.");
      }

      if (event.target.id === "contactForm") {
        event.preventDefault();
        const message = document.getElementById("contactMessageBox");
        message.innerHTML = `<div class="form-message success" style="border-color:rgba(16,185,129,.22);background:rgba(16,185,129,.08);color:var(--text)">${icon("check", 16)} Demo message received. No information was sent or stored; backend integration will be added in a future phase.</div>`;
        showToast("Contact form demonstrated. No data was sent.");
      }

      if (event.target.id === "searchForm") {
        event.preventDefault();
        const query = document.getElementById("searchInput").value.trim();
        const nextHash = `#/search${query ? `?q=${encodeURIComponent(query)}` : ""}`;
        if (window.location.hash === nextHash) {
          render();
        } else {
          window.location.hash = nextHash;
        }
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeMobileMenu();
      }
    });

    window.addEventListener("hashchange", () => render());
    window.addEventListener("scroll", updateReadingProgress, { passive: true });
    window.addEventListener("resize", () => {
      if (window.innerWidth > 1120) closeMobileMenu();
    });

    window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", event => {
      let savedTheme = null;
      try {
        savedTheme = localStorage.getItem("technova-theme");
      } catch (error) {
        savedTheme = null;
      }
      if (!savedTheme) setTheme(event.matches ? "dark" : "light", false);
    });

    let initialTheme = "light";
    try {
      initialTheme = localStorage.getItem("technova-theme") ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    } catch (error) {
      initialTheme = document.documentElement.dataset.theme || "light";
    }

    renderFooter();
    setTheme(initialTheme, false);
    render();
  </script>
</body>
</html>
